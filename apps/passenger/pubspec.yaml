  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  dio: ^5.7.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
