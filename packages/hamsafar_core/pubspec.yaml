name: hamsafar_core
description: Shared API client, models, design system and realtime layer for the Hamsafar apps.
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Networking
  dio: ^5.7.0

  # State
  flutter_riverpod: ^2.6.1

  # Storage — tokens go in the keychain/keystore, never in plain preferences.
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # Realtime
  web_socket_channel: ^3.0.1

  intl: ^0.20.2
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
