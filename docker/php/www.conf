[www]
; Dynamic keeps idle memory low while absorbing the morning peak, when every
; bus starts reporting within a few minutes of each other.
pm = dynamic
pm.max_children = 40
pm.start_servers = 8
pm.min_spare_servers = 6
pm.max_spare_servers = 16
pm.max_requests = 500

; Surface slow requests: a GPS ingest taking seconds means the route matcher
; or the database is in trouble.
slowlog = /dev/stderr
request_slowlog_timeout = 5s

catch_workers_output = yes
decorate_workers_output = no
clear_env = no
