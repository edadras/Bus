; Sized for an API that ingests GPS at high frequency and accepts photo
; uploads on complaints; everything else stays conservative.
memory_limit = 256M
max_execution_time = 60
upload_max_filesize = 12M
post_max_size = 16M
max_input_vars = 2000

expose_php = Off
date.timezone = UTC

; Persian text is multi-byte throughout.
default_charset = "UTF-8"
mbstring.internal_encoding = UTF-8

; Errors go to the container log, never to the response body.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
